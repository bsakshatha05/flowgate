<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowGate Student</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="wrap narrow">
    <div class="card" style="margin-bottom:16px">
      <label for="whoSearch">Signed in as (demo login)</label>
      <div class="picker">
        <input id="whoSearch" autocomplete="off" placeholder="Start typing a name" aria-label="Search for a person"
               role="combobox" aria-expanded="false" aria-controls="whoList">
        <ul id="whoList" class="picker-list hidden" role="listbox"></ul>
      </div>
      <p class="small muted" id="whoHint" style="margin:8px 2px 0"></p>
    </div>
    <div id="app" class="grid"></div>
  </main>
  <script src="/lib/qrcode.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
